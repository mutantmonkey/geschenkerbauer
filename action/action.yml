name: geschenkerbauer action
description: Build Arch Linux packages
inputs:
  packages:
    description: Packages to build (in order)
    required: true
  nodeps:
    description: Skip dependency checks when building
    required: false
runs:
  using: docker
  image: ../containers/builder/Dockerfile
  env:
    BUILDSRC: "${{ env.GITHUB_WORKSPACE }}/buildsrc"
    PKGDEST: "${{ env.GITHUB_WORKSPACE }}/repo"
  args:
    - ${{ inputs.packages }}
